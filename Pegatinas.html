			<script>
			document.addEventListener('DOMContentLoaded', function () {
				const filterEl = document.getElementById('filter');
				const searchEl = document.getElementById('search');

				function applyFilters() {
					const selectedGroup = filterEl ? filterEl.value.trim().toLowerCase() : 'all';
					const searchQuery = searchEl ? searchEl.value.trim().toLowerCase() : '';
					const tiles = document.querySelectorAll('.tiles article');

					tiles.forEach(tile => {
						// Obtener etiquetas (compatibilidad con data-tags o data-tag)
						const rawTags = tile.getAttribute('data-tags') || tile.getAttribute('data-tag') || '';
						const tags = rawTags.toLowerCase().split(/\s*,\s*|\s+/).filter(Boolean);

						// Obtener el nombre del personaje desde el tag <h2> dentro del article
						const titleEl = tile.querySelector('h2');
						const titleText = titleEl ? titleEl.textContent.toLowerCase() : '';

						// Comprobar coincidencia de categoría
						const matchesGroup = (selectedGroup === 'all' || tags.includes(selectedGroup));

						// Comprobar coincidencia de texto
						const matchesSearch = titleText.includes(searchQuery);

						// Mostrar u ocultar la tarjeta
						if (matchesGroup && matchesSearch) {
							tile.style.display = '';
						} else {
							tile.style.display = 'none';
						}
					});
				}

				if (filterEl) {
					filterEl.addEventListener('change', applyFilters);
				}
				if (searchEl) {
					searchEl.addEventListener('input', applyFilters);
				}

				applyFilters();
			});
			</script>
